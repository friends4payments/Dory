# ==============================================================================
# Dory AI — Production Docker Compose
# ==============================================================================

services:
  # ── MongoDB (replica set for Prisma transactions) ─────────────────
  mongodb:
    image: mongo:7
    container_name: dory-mongo
    volumes:
      - dory-mongo-data:/data/db
    command: ['--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30
    networks:
      - dory-net

  # ── Game Agent (mineflayer bot + LLM) ─────────────────────────────
  game-agent:
    image: dory-monorepo
    container_name: dory-game-agent
    working_dir: /app/services/game-agent
    command: ["node", "dist/index.js"]
    env_file: .env.production
    environment:
      - GAME_AGENT_PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/dory?replicaSet=rs0
      - VOICE_AGENT_URL=http://voice-agent:4001
      # Override LLM_MODEL (which is in OpenRouter format for voice-agent) with direct OpenAI model
      - OPENAI_MODEL=gpt-4o
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dory-net

  # ── Voice Agent (LiveKit + Deepgram + ElevenLabs) ─────────────────
  voice-agent:
    image: dory-monorepo
    container_name: dory-voice-agent
    working_dir: /app/services/voice-agent
    command: ["node", "dist/index.js"]
    env_file: .env.production
    environment:
      - PORT=4001
      - GAME_AGENT_URL=http://game-agent:3000
      - PERSONA_BUILDER_URL=http://persona-builder-agent:4003
    depends_on:
      - game-agent
    restart: unless-stopped
    networks:
      - dory-net

  # ── Gatekeeper Agent ──────────────────────────────────────────────
  gatekeeper-agent:
    image: dory-monorepo
    container_name: dory-gatekeeper-agent
    working_dir: /app/services/gatekeeper-agent
    command: ["node", "dist/index.js"]
    env_file: .env.production
    environment:
      - PORT=4002
      - PERSONA_BUILDER_URL=http://persona-builder-agent:4003
    depends_on:
      - voice-agent
    restart: unless-stopped
    networks:
      - dory-net

  # ── Persona Builder Agent ─────────────────────────────────────────
  persona-builder-agent:
    image: dory-monorepo
    container_name: dory-persona-builder
    working_dir: /app/services/persona-builder-agent
    command: ["node", "dist/index.js"]
    env_file: .env.production
    environment:
      - PORT=4003
      - MONGODB_URI=mongodb://mongodb:27017/dory?replicaSet=rs0
      # Persona builder uses OpenRouter via OpenAI SDK — override the direct OpenAI key
      - OPENAI_API_KEY=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
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dory-net

  # ── Web App (Next.js) ─────────────────────────────────────────────
  web:
    image: dory-monorepo
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEKEEPER_WS_URL: ws://${DEPLOY_URL:-localhost}/gatekeeper/ws
        NEXT_PUBLIC_PERSONA_WS_URL: ws://${DEPLOY_URL:-localhost}/persona/ws
        NEXT_PUBLIC_VOICE_AGENT_WS_URL: ws://${DEPLOY_URL:-localhost}/voice/ws
        NEXT_PUBLIC_VOICE_AGENT_API_URL: http://${DEPLOY_URL:-localhost}/voice
        NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:-wss://dory-pi7wfp2y.livekit.cloud}
    container_name: dory-web
    working_dir: /app/apps/web
    command: ["npx", "next", "start", "-p", "3000"]
    restart: unless-stopped
    networks:
      - dory-net

  # ── Nginx (reverse proxy) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dory-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tools:/usr/share/nginx/html/tools:ro
    depends_on:
      - web
      - game-agent
      - voice-agent
      - gatekeeper-agent
      - persona-builder-agent
    restart: unless-stopped
    networks:
      - dory-net

networks:
  dory-net:
    driver: bridge

volumes:
  dory-mongo-data:
