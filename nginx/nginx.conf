upstream web        { server web:3000; }
upstream game       { server game-agent:3000; }
upstream voice      { server voice-agent:4001; }
upstream gatekeeper { server gatekeeper-agent:4002; }
upstream persona    { server persona-builder-agent:4003; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # ── Voice Agent ──────────────────────────────────────────────────
    location /voice/ {
        proxy_pass http://voice/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Gatekeeper Agent ─────────────────────────────────────────────
    location /gatekeeper/ {
        proxy_pass http://gatekeeper/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Persona Builder Agent ────────────────────────────────────────
    location /persona/ {
        proxy_pass http://persona/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Game Agent ───────────────────────────────────────────────────
    location /game/ {
        proxy_pass http://game/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # ── Dev / Debug Tools (static HTML) ──────────────────────────────
    location /tools/ {
        alias /usr/share/nginx/html/tools/;
        index index.html;
    }

    # ── Web App (catch-all) ──────────────────────────────────────────
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
